name: Linkprüfung

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"   # wöchentlich montags

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_links.py
      - run: cat linkcheck_report.md >> "$GITHUB_STEP_SUMMARY"
      - run: python scripts/build_db.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ linkcheck_report.md
          git diff --cached --quiet || git commit -m "Daten: Linkprüfung $(date +%F)"
          git push
