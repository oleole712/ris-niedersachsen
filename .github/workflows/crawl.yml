name: RIS-Crawler

on:
  workflow_dispatch:
    inputs:
      umfang:
        description: "alle = alle nicht manuell gepflegten Kommunen, offen = nur ohne RIS-URL"
        type: choice
        options: [offen, alle]
        default: offen
  schedule:
    - cron: "17 3 1 * *"   # monatlich: nur offene Einträge

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Crawler
        run: |
          if [ "${{ github.event.inputs.umfang }}" = "alle" ]; then
            python scripts/crawl_ris.py
          else
            python scripts/crawl_ris.py --nur-offene
          fi
      - run: python scripts/build_db.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daten: RIS-Crawler $(date +%F)"
          git push
