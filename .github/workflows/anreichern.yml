name: Anreichern (Software, Mitgliedsgemeinden, OParl)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 15 * *"   # monatlich am 15.

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/software.py --live
      - run: python scripts/mitgliedsgemeinden.py --live
      - run: python scripts/oparl.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python scripts/build_db.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ PRUEFLISTE.md README.md
          git diff --cached --quiet || git commit -m "Daten: Anreicherung $(date +%F)"
          git push
